spring:
  cloud:
    gateway:
      routes:
        - id: ms-cliente
          uri: lb://CLIENTS
          predicates:
            - Path=/api/clients/**
        - id: ms-autopartes
          uri: lb://AUTOPARTES
          predicates:
            - Path=/api/autopartes/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: https://ms-eureka-server.nxgen.dev/eureka/
    register-with-eureka: true
    fetch-registry: true # Necesario para que el gateway encuentre los servicios

server:
  port: 8080
