spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-cliente
              uri: lb://CLIENTS
              predicates:
                - Path=/api/clients/**
    loadbalancer:
      ribbon:
        enabled: 'false'
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: https://eureka-server.vardocs.app/eureka/
    register-with-eureka: 'true'

server:
  port: '8080'
