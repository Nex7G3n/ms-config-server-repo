spring:
  cloud:
    gateway:
      # ELIMINADO: server.webflux
      routes:
        - id: ms-cliente
          uri: lb://CLIENTS
          predicates:
            - Path=/api/clients/**
        - id: ms-autopartes
          uri: lb://AUTOPARTES
          predicates:
            - Path=/api/**
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: https://ms-eureka-server.nxgen.dev/eureka/
    register-with-eureka: true
    fetch-registry: true # Necesario para que el gateway encuentre los servicios

server:
  port: 8080
